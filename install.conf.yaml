- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.dotfiles: 
        if: '[ ! -d "$HOME/.dotfiles" ]'
        path: ""
    ~/.vimrc: ./vim/vimrc
    ~/.gitconfig: ./git/gitconfig
    ~/.bashrc:  
        if: '[ $(ps -o comm= $PPID | grep bash) ]'
        path: ./bash/bashrc
    ~/.zshrc:
        if: '[ $(ps -o comm= $PPID | grep zsh) ]'
        path: ./zsh/zshrc
    ~/.tmux.conf: ./tmux/tmux.conf
    ~/.fzf.bash:
        if: '[ $(ps -o comm= $PPID | grep bash) ]'
        path: ./.fzf.bash
    ~/.fzf.zsh:
        if: '[ $(ps -o comm= $PPID | grep zsh) ]'
        path: ./.fzf.zsh
    ~/.gdbinit: ./.gdbinit
    ~/.tmux/plugins/tpm:
        create: true
        path: ./external/tpm
    ~/.config/base16-shell:
        create: true
        path: ./external/base16-shell
    ~/.vim/colors:
        create: true
        path: ./external/base16-vim/colors

- create:
    - ~/.vim/undo-history

- shell:
  - [./fzf/install --bin]
  - 
    command: ./tmux/install
    stdout: true
    stderr: true
    description: Installing tmux
  - [./external/tpm/bin/install_plugins]
