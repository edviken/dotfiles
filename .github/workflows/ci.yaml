name: smoke-test

on:
  push:
    branches: [ "main", "test-pipeline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: zsh
          - os: ubuntu-latest
            command: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # For some reason macOS seems to already have a .gitconfig file which makes the ./install
      # step exit with non-zero exitcode.
      # - name: rm gitconfig
      #   run: rm -f $HOME/.gitconfig

      - name: Run Tests on macOS
        if: matrix.os == 'macos-latest'
        shell: zsh {0}
        run: rm -f $HOME/.gitconfig && ./test

      - name: Run Tests on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./test
